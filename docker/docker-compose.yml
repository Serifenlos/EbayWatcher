# Portainer: Stacks > Add stack > Web editor. Diesen Inhalt einfügen und
# unten unter "Environment variables" EBAY_CLIENT_ID, EBAY_CLIENT_SECRET und ADMIN_PASSWORD setzen.
services:
  ebay-watcher:
    image: ghcr.io/DEIN-GITHUB-NAME/ebay-watcher:latest
    container_name: ebay-watcher
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      TZ: Europe/Berlin
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      ADMIN_USER: simon
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Benutzer- und Gruppen-ID für den Datenordner (Synology: meist 1026 und 100, per SSH mit "id" prüfen)
      PUID: "1026"
      PGID: "100"
    volumes:
      - /volume1/docker/ebay-watcher:/data
