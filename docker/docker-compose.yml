# Ebay Watcher – Docker Compose
#
# Docker Compose: Werte in die Datei .env daneben schreiben (Vorlage: .env.example), dann "docker compose up -d".
# Portainer: Stacks > Add stack > Web editor, diesen Inhalt einfügen und die Werte unter
#            "Environment variables" eintragen.
# Pflicht sind EBAY_CLIENT_ID, EBAY_CLIENT_SECRET und ADMIN_PASSWORD, alles andere hat Standardwerte.
services:
  ebay-watcher:
    image: ghcr.io/serifenlos/ebaywatcher:latest
    container_name: ebay-watcher
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_RESET: ${ADMIN_RESET:-}
      TZ: ${TZ:-Europe/Berlin}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Benutzer und Gruppe für den Datenordner (Synology: meist 1026 und 100, per SSH mit "id" prüfen)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_PATH:-./data}:/data
